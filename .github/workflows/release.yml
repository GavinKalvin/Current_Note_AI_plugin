name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm audit --prod
      - run: pnpm verify:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Package release
        run: zip "current-note-ai-${GITHUB_REF_NAME#v}.zip" main.js manifest.json styles.css
      - name: Publish release assets
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css "current-note-ai-${GITHUB_REF_NAME#v}.zip" --generate-notes --title "Current Note AI $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
